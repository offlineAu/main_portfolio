default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: airl_portfolio_development
  url: <%= ENV["DATABASE_URL"] %>

test:
  <<: *default
  database: airl_portfolio_test
  url: <%= ENV["TEST_DATABASE_URL"] %>

production:
  <<: *default
  # Vercel prefixes the Supabase integration variables with the connection name.
  url: <%= ENV["DATABASE_URL"].presence || ENV["DATABASE_URL_POSTGRES_URL"].presence %>
