name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/airl_portfolio_test
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/rails db:test:prepare test
      - run: bin/rails zeitwerk:check
      - run: bin/brakeman --no-pager
      - run: bin/bundler-audit
      - run: bin/importmap audit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PORTFOLIO_BROWSER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/airl_portfolio_browser
      - run: bin/rails assets:precompile
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: "1"
